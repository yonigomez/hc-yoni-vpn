name: Build hc Yoni APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36 and Build Tools
        run: |
          SDKMANAGER=$(command -v sdkmanager || ls -d "${ANDROID_HOME}/cmdline-tools/"*"/bin/sdkmanager" 2>/dev/null | head -n 1)
          mkdir -p "${ANDROID_HOME}/licenses"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Build native badvpn-tun2socks (16KB aligned)
        run: |
          NDK_DIR="${ANDROID_NDK_HOME:-}"
          if [ -z "$NDK_DIR" ] || [ ! -x "$NDK_DIR/ndk-build" ]; then
            NDK_DIR=$(ls -d "${ANDROID_HOME}/ndk/"* 2>/dev/null | sort -V | tail -n 1)
          fi
          if [ -z "$NDK_DIR" ] || [ ! -x "$NDK_DIR/ndk-build" ]; then
            SDKMANAGER=$(command -v sdkmanager || ls -d "${ANDROID_HOME}/cmdline-tools/"*"/bin/sdkmanager" 2>/dev/null | head -n 1)
            yes | "$SDKMANAGER" "ndk;28.2.13676358"
            NDK_DIR="${ANDROID_HOME}/ndk/28.2.13676358"
          fi
          echo "Usando Android NDK: $NDK_DIR"

          rm -rf /tmp/ss-src /tmp/tun2socks-ndk
          git clone --depth 1 https://github.com/shadowsocks/shadowsocks-android.git /tmp/ss-src
          cd /tmp/ss-src
          git submodule update --init --depth 1 core/src/main/jni/badvpn core/src/main/jni/libancillary

          mkdir -p /tmp/tun2socks-ndk/jni
          cp -r core/src/main/jni/badvpn /tmp/tun2socks-ndk/jni/badvpn
          cp -r core/src/main/jni/libancillary /tmp/tun2socks-ndk/jni/libancillary

          cat << 'EOF' > /tmp/tun2socks-ndk/jni/Application.mk
          APP_ABI := arm64-v8a armeabi-v7a x86_64 x86
          APP_PLATFORM := android-26
          APP_LDFLAGS := -Wl,-z,max-page-size=16384
          EOF

          cat << 'EOF' > /tmp/tun2socks-ndk/jni/Android.mk
          LOCAL_PATH := $(call my-dir)

          include $(CLEAR_VARS)
          ANCILLARY_SOURCE := fd_recv.c fd_send.c
          LOCAL_MODULE := libancillary
          LOCAL_CFLAGS := -I$(LOCAL_PATH)/libancillary -Wno-unused-parameter
          LOCAL_SRC_FILES := $(addprefix libancillary/, $(ANCILLARY_SOURCE))
          include $(BUILD_STATIC_LIBRARY)

          include $(CLEAR_VARS)
          LOCAL_CFLAGS := -std=gnu99
          LOCAL_CFLAGS += -DBADVPN_THREADWORK_USE_PTHREAD -DBADVPN_LINUX -DBADVPN_BREACTOR_BADVPN -D_GNU_SOURCE
          LOCAL_CFLAGS += -DBADVPN_USE_SIGNALFD -DBADVPN_USE_EPOLL
          LOCAL_CFLAGS += -DBADVPN_LITTLE_ENDIAN -DBADVPN_THREAD_SAFE
          LOCAL_CFLAGS += -DNDEBUG -DANDROID -Wno-parentheses -Wno-unused-value -Wno-deprecated-non-prototype -Wno-incompatible-pointer-types
          LOCAL_STATIC_LIBRARIES := libancillary
          LOCAL_C_INCLUDES := \
            $(LOCAL_PATH)/libancillary \
            $(LOCAL_PATH)/badvpn/lwip/src/include/ipv4 \
            $(LOCAL_PATH)/badvpn/lwip/src/include/ipv6 \
            $(LOCAL_PATH)/badvpn/lwip/src/include \
            $(LOCAL_PATH)/badvpn/lwip/custom \
            $(LOCAL_PATH)/badvpn/
          TUN2SOCKS_SOURCES := \
            base/BLog_syslog.c \
            system/BReactor_badvpn.c \
            system/BSignal.c \
            system/BConnection_common.c \
            system/BConnection_unix.c \
            system/BTime.c \
            system/BUnixSignal.c \
            system/BNetwork.c \
            flow/StreamRecvInterface.c \
            flow/PacketRecvInterface.c \
            flow/PacketPassInterface.c \
            flow/StreamPassInterface.c \
            flow/SinglePacketBuffer.c \
            flow/BufferWriter.c \
            flow/PacketBuffer.c \
            flow/PacketStreamSender.c \
            flow/PacketPassConnector.c \
            flow/PacketProtoFlow.c \
            flow/PacketPassFairQueue.c \
            flow/PacketProtoEncoder.c \
            flow/PacketProtoDecoder.c \
            socksclient/BSocksClient.c \
            tuntap/BTap.c \
            lwip/src/core/udp.c \
            lwip/src/core/memp.c \
            lwip/src/core/init.c \
            lwip/src/core/pbuf.c \
            lwip/src/core/tcp.c \
            lwip/src/core/tcp_out.c \
            lwip/src/core/netif.c \
            lwip/src/core/def.c \
            lwip/src/core/ip.c \
            lwip/src/core/mem.c \
            lwip/src/core/tcp_in.c \
            lwip/src/core/stats.c \
            lwip/src/core/inet_chksum.c \
            lwip/src/core/timeouts.c \
            lwip/src/core/ipv4/icmp.c \
            lwip/src/core/ipv4/igmp.c \
            lwip/src/core/ipv4/ip4_addr.c \
            lwip/src/core/ipv4/ip4_frag.c \
            lwip/src/core/ipv4/ip4.c \
            lwip/src/core/ipv4/autoip.c \
            lwip/src/core/ipv6/ethip6.c \
            lwip/src/core/ipv6/inet6.c \
            lwip/src/core/ipv6/ip6_addr.c \
            lwip/src/core/ipv6/mld6.c \
            lwip/src/core/ipv6/dhcp6.c \
            lwip/src/core/ipv6/icmp6.c \
            lwip/src/core/ipv6/ip6.c \
            lwip/src/core/ipv6/ip6_frag.c \
            lwip/src/core/ipv6/nd6.c \
            lwip/custom/sys.c \
            tun2socks/tun2socks.c \
            base/DebugObject.c \
            base/BLog.c \
            base/BPending.c \
            system/BDatagram_unix.c \
            flowextra/PacketPassInactivityMonitor.c \
            socks_udp_client/SocksUdpClient.c \
            tun2socks/SocksUdpGwClient.c \
            udpgw_client/UdpGwClient.c
          LOCAL_MODULE := tun2socks
          LOCAL_LDLIBS := -ldl -llog
          LOCAL_SRC_FILES := $(addprefix badvpn/, $(TUN2SOCKS_SOURCES))
          include $(BUILD_SHARED_EXECUTABLE)
          EOF

          cd /tmp/tun2socks-ndk
          "$NDK_DIR/ndk-build" -j$(nproc)

          rm -rf "${GITHUB_WORKSPACE}/app/src/main/jniLibs"
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            mkdir -p "${GITHUB_WORKSPACE}/app/src/main/jniLibs/${abi}"
            if [ -f "libs/${abi}/tun2socks" ]; then
              cp "libs/${abi}/tun2socks" "${GITHUB_WORKSPACE}/app/src/main/jniLibs/${abi}/libtun2socks.so"
            elif [ -f "libs/${abi}/libtun2socks.so" ]; then
              cp "libs/${abi}/libtun2socks.so" "${GITHUB_WORKSPACE}/app/src/main/jniLibs/${abi}/libtun2socks.so"
            else
              echo "No se encontro binario tun2socks para ${abi}"
              ls -la "libs/${abi}/" || true
              exit 1
            fi
          done
          ls -la "${GITHUB_WORKSPACE}/app/src/main/jniLibs/"*

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Build hc Yoni APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk hc-yoni.apk

      - name: Upload APK direct download
        uses: actions/upload-artifact@v7
        with:
          name: hc-yoni-apk
          path: hc-yoni.apk
          archive: false
          if-no-files-found: error
          retention-days: 30
