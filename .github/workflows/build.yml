name: Build hc Yoni APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36 and Build Tools
        run: |
          SDKMANAGER=$(command -v sdkmanager || ls -d "${ANDROID_HOME}/cmdline-tools/"*"/bin/sdkmanager" 2>/dev/null | head -n 1)
          mkdir -p "${ANDROID_HOME}/licenses"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Build native badvpn-tun2socks (16KB aligned)
        run: |
          NDK_DIR="${ANDROID_NDK_HOME:-}"
          if [ -z "$NDK_DIR" ] || [ ! -x "$NDK_DIR/ndk-build" ]; then
            NDK_DIR=$(ls -d "${ANDROID_HOME}/ndk/"* 2>/dev/null | sort -V | tail -n 1)
          fi
          if [ -z "$NDK_DIR" ] || [ ! -x "$NDK_DIR/ndk-build" ]; then
            SDKMANAGER=$(command -v sdkmanager || ls -d "${ANDROID_HOME}/cmdline-tools/"*"/bin/sdkmanager" 2>/dev/null | head -n 1)
            yes | "$SDKMANAGER" "ndk;27.3.13750724"
            NDK_DIR="${ANDROID_HOME}/ndk/27.3.13750724"
          fi
          echo "Usando Android NDK: $NDK_DIR"

          rm -rf /tmp/ss-src /tmp/tun2socks-ndk
          git clone --depth 1 https://github.com/shadowsocks/shadowsocks-android.git /tmp/ss-src
          cd /tmp/ss-src
          git submodule update --init --depth 1 core/src/main/jni/badvpn core/src/main/jni/libancillary

          mkdir -p /tmp/tun2socks-ndk/jni
          cp -r core/src/main/jni/badvpn /tmp/tun2socks-ndk/jni/badvpn
          cp -r core/src/main/jni/libancillary /tmp/tun2socks-ndk/jni/libancillary

          sed 's/^[[:space:]]*//' << 'EOF' > /tmp/tun2socks-ndk/jni/Application.mk
          APP_ABI := arm64-v8a armeabi-v7a x86_64 x86
          APP_PLATFORM := android-26
          APP_MODULES := tun2socks
          APP_LDFLAGS := -Wl,-z,max-page-size=16384
          EOF

          sed 's/^[[:space:]]*//' << 'EOF' > /tmp/tun2socks-ndk/jni/Android.mk
          LOCAL_PATH := $(call my-dir)

          include $(CLEAR_VARS)
          LOCAL_MODULE := libancillary
          LOCAL_CFLAGS := -I$(LOCAL_PATH)/libancillary -Wno-unused-parameter
          LOCAL_SRC_FILES := libancillary/fd_recv.c libancillary/fd_send.c
          include $(BUILD_STATIC_LIBRARY)

          include $(CLEAR_VARS)
          LOCAL_MODULE := tun2socks
          LOCAL_CFLAGS := -std=gnu99 \
            -DBADVPN_THREADWORK_USE_PTHREAD -DBADVPN_LINUX -DBADVPN_BREACTOR_BADVPN -D_GNU_SOURCE \
            -DBADVPN_USE_SIGNALFD -DBADVPN_USE_EPOLL \
            -DBADVPN_LITTLE_ENDIAN -DBADVPN_THREAD_SAFE \
            -DNDEBUG -DANDROID \
            -Wno-parentheses -Wno-unused-value -Wno-deprecated-non-prototype \
            -Wno-incompatible-pointer-types -Wno-int-conversion -Wno-pointer-sign
          LOCAL_STATIC_LIBRARIES := libancillary
          LOCAL_C_INCLUDES := \
            $(LOCAL_PATH)/libancillary \
            $(LOCAL_PATH)/badvpn/lwip/src/include/ipv4 \
            $(LOCAL_PATH)/badvpn/lwip/src/include/ipv6 \
            $(LOCAL_PATH)/badvpn/lwip/src/include \
            $(LOCAL_PATH)/badvpn/lwip/custom \
            $(LOCAL_PATH)/badvpn
          LOCAL_SRC_FILES := \
            badvpn/base/BLog_syslog.c \
            badvpn/system/BReactor_badvpn.c \
            badvpn/system/BSignal.c \
            badvpn/system/BConnection_common.c \
            badvpn/system/BConnection_unix.c \
            badvpn/system/BTime.c \
            badvpn/system/BUnixSignal.c \
            badvpn/system/BNetwork.c \
            badvpn/flow/StreamRecvInterface.c \
            badvpn/flow/PacketRecvInterface.c \
            badvpn/flow/PacketPassInterface.c \
            badvpn/flow/StreamPassInterface.c \
            badvpn/flow/SinglePacketBuffer.c \
            badvpn/flow/BufferWriter.c \
            badvpn/flow/PacketBuffer.c \
            badvpn/flow/PacketStreamSender.c \
            badvpn/flow/PacketPassConnector.c \
            badvpn/flow/PacketProtoFlow.c \
            badvpn/flow/PacketPassFairQueue.c \
            badvpn/flow/PacketProtoEncoder.c \
            badvpn/flow/PacketProtoDecoder.c \
            badvpn/socksclient/BSocksClient.c \
            badvpn/tuntap/BTap.c \
            badvpn/lwip/src/core/udp.c \
            badvpn/lwip/src/core/memp.c \
            badvpn/lwip/src/core/init.c \
            badvpn/lwip/src/core/pbuf.c \
            badvpn/lwip/src/core/tcp.c \
            badvpn/lwip/src/core/tcp_out.c \
            badvpn/lwip/src/core/netif.c \
            badvpn/lwip/src/core/def.c \
            badvpn/lwip/src/core/ip.c \
            badvpn/lwip/src/core/mem.c \
            badvpn/lwip/src/core/tcp_in.c \
            badvpn/lwip/src/core/stats.c \
            badvpn/lwip/src/core/inet_chksum.c \
            badvpn/lwip/src/core/timeouts.c \
            badvpn/lwip/src/core/ipv4/icmp.c \
            badvpn/lwip/src/core/ipv4/igmp.c \
            badvpn/lwip/src/core/ipv4/ip4_addr.c \
            badvpn/lwip/src/core/ipv4/ip4_frag.c \
            badvpn/lwip/src/core/ipv4/ip4.c \
            badvpn/lwip/src/core/ipv4/autoip.c \
            badvpn/lwip/src/core/ipv6/ethip6.c \
            badvpn/lwip/src/core/ipv6/inet6.c \
            badvpn/lwip/src/core/ipv6/ip6_addr.c \
            badvpn/lwip/src/core/ipv6/mld6.c \
            badvpn/lwip/src/core/ipv6/dhcp6.c \
            badvpn/lwip/src/core/ipv6/icmp6.c \
            badvpn/lwip/src/core/ipv6/ip6.c \
            badvpn/lwip/src/core/ipv6/ip6_frag.c \
            badvpn/lwip/src/core/ipv6/nd6.c \
            badvpn/lwip/custom/sys.c \
            badvpn/tun2socks/tun2socks.c \
            badvpn/base/DebugObject.c \
            badvpn/base/BLog.c \
            badvpn/base/BPending.c \
            badvpn/system/BDatagram_unix.c \
            badvpn/flowextra/PacketPassInactivityMonitor.c \
            badvpn/socks_udp_client/SocksUdpClient.c \
            badvpn/tun2socks/SocksUdpGwClient.c \
            badvpn/udpgw_client/UdpGwClient.c
          LOCAL_LDLIBS := -ldl -llog
          include $(BUILD_EXECUTABLE)
          EOF

          cd /tmp/tun2socks-ndk
          "$NDK_DIR/ndk-build" -j$(nproc)

          rm -rf "${GITHUB_WORKSPACE}/app/src/main/jniLibs"
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            mkdir -p "${GITHUB_WORKSPACE}/app/src/main/jniLibs/${abi}"
            cp "libs/${abi}/tun2socks" "${GITHUB_WORKSPACE}/app/src/main/jniLibs/${abi}/libtun2socks.so"
          done
          ls -lh "${GITHUB_WORKSPACE}/app/src/main/jniLibs/"*

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Build hc Yoni APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk hc-yoni.apk

      - name: Upload APK direct download
        uses: actions/upload-artifact@v7
        with:
          name: hc-yoni-apk
          path: hc-yoni.apk
          archive: false
          if-no-files-found: error
          retention-days: 30
